<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Connexion - Optimiseur de tournées</title>
<style>
  body {
    font-family: Arial, sans-serif; color: #222; display: flex; align-items: center;
    justify-content: center; min-height: 90vh; margin: 0; padding: 0 16px;
  }
  .carte { max-width: 360px; width: 100%; text-align: center; }
  h1 { font-size: 20px; margin-bottom: 24px; }
  input[type=password] {
    width: 100%; padding: 10px; font-size: 15px; box-sizing: border-box;
    margin-bottom: 12px; border: 1px solid #ccc; border-radius: 4px;
  }
  button {
    width: 100%; background: #2e7d32; color: white; border: none; border-radius: 4px;
    padding: 10px; font-size: 15px; cursor: pointer;
  }
  .erreur { background: #f8d7da; border: 1px solid #d9534f; color: #842029; padding: 10px; border-radius: 4px; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="carte">
  <h1>Optimiseur de tournées — Le Décapeur A.C.</h1>
  {% if error %}
  <div class="erreur">{{ error }}</div>
  {% endif %}
  <form method="post">
    <input type="password" name="password" placeholder="Mot de passe" autofocus required>
    <button type="submit">Entrer</button>
  </form>
</div>
</body>
</html>
